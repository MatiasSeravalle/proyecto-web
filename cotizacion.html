<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cotizacion.css">
    <script src="cotizacion.js"></script>
</head>
<body>
    
    <nav class="nav__container">
        <ul class="nav__ul">
            <li class="nav__li"><a href="index.html" class="li--a">Inicio</a></li>
            <li class="nav__li"><a href="about.html" class="li--a">Sobre Nosotros</a></li>
            <li class="nav__li"><a href="#" class="li--a" onclick="catalogo()">Catálogo</a></li>
        </ul>
        <button class="nav__button" onclick="enviar()">Registrarse</button>
    </nav>

     <section id="cotizacion">
        <form action="" class="coti__form">
            <h3>Cotización</h3>
            <div class="coti__container">
                <label for="">Modelos Disponibles</label>
                <select name="modelo" id="modelo" class="form__select">
                    <option value="0">Elija su modelo deseado</option>
                    <option value="1">Audi RS3</option>
                    <option value="2">Audi TT</option>
                    <option value="3">Audi  A5</option>
                </select>
            </div>
            
            <div class="coti__container">
                <label for="">Formas de Pago</label>
                <select name="pago" id="pago" class="form__select">
                    <option value="0">Elija  su forma de pago</option>
                    <option value="1">Pago Unico</option>
                    <option value="2">6 Cuotas</option>
                    <option value="3">12 Cuotas</option>
                </select>
            </div>
            <div class="coti__container button--container">
                <h5 id="result"></h5>
                <button class="coti__button" onclick="validar()" type="button">Cotizar</button>
            </div>
            
        </form>
    </section>

</body>
</html>
